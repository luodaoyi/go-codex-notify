[package]
name = "codex-notify"
version = "1.3.23"
edition = "2021"
rust-version = "1.80"
description = "Multi-channel notifier for OpenAI Codex notifications"
license = "MIT"
repository = "https://github.com/luodaoyi/go-codex-notify"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossterm = "0.28"
dirs = "6.0"
hex = "0.4"
hmac = "0.12"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
toml_edit = "0.22"

[dev-dependencies]
