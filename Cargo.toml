[package]
name = "codex-notify"
version = "1.3.26"
edition = "2021"
rust-version = "1.80"
description = "Multi-channel notifier for OpenAI Codex notifications"
license = "MIT"
repository = "https://github.com/luodaoyi/go-codex-notify"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
pulldown-cmark = { version = "0.12", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile = "3.15"
