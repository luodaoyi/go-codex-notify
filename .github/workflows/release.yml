name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release, e.g. v1.3.14'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_version: ${{ steps.version.outputs.npm_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "version is required"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version format: $VERSION"
            echo "expected: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          NPM_VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git fetch --tags --force
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "tag already exists: $VERSION"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

  build:
    name: Build ${{ matrix.package }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: win32-x64
            binary: codex-notify.exe
            artifact: codex-notify-windows-x64.exe
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            package: win32-arm64
            binary: codex-notify.exe
            artifact: codex-notify-windows-arm64.exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: linux-x64
            binary: codex-notify
            artifact: codex-notify-linux-x64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            package: linux-arm64
            binary: codex-notify
            artifact: codex-notify-linux-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            package: darwin-x64
            binary: codex-notify
            artifact: codex-notify-darwin-x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            package: darwin-arm64
            binary: codex-notify
            artifact: codex-notify-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build binary
        env:
          CODEX_NOTIFY_VERSION: ${{ needs.prepare-release.outputs.npm_version }}
        shell: bash
        run: |
          mkdir -p dist
          cargo build --release --locked --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  publish-release:
    name: Publish release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f -maxdepth 3 -print -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: release-assets/*

  publish-npm:
    name: Publish npm package
    needs: [prepare-release, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
          scope: '@asural'

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update package version if needed
        shell: bash
        env:
          TARGET_VERSION: ${{ needs.prepare-release.outputs.npm_version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const version = process.env.TARGET_VERSION;
          const packageDirs = [
            'win32-x64', 'win32-arm64', 'linux-x64',
            'linux-arm64', 'darwin-x64', 'darwin-arm64'
          ];
          const entryManifests = [
            'package.json',
            path.join('packages', 'go-codex-notify', 'package.json')
          ];
          for (const manifestPath of entryManifests) {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = version;
            for (const dependency of Object.keys(manifest.optionalDependencies)) {
              manifest.optionalDependencies[dependency] = version;
            }
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          }
          for (const directory of packageDirs) {
            const manifestPath = path.join('packages', directory, 'package.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = version;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          }
          NODE

      - name: Stage platform npm packages
        shell: bash
        run: |
          mkdir -p packages/{win32-x64,win32-arm64,linux-x64,linux-arm64,darwin-x64,darwin-arm64}/bin
          cp artifacts/win32-x64/codex-notify-windows-x64.exe packages/win32-x64/bin/codex-notify.exe
          cp artifacts/win32-arm64/codex-notify-windows-arm64.exe packages/win32-arm64/bin/codex-notify.exe
          cp artifacts/linux-x64/codex-notify-linux-x64 packages/linux-x64/bin/codex-notify
          cp artifacts/linux-arm64/codex-notify-linux-arm64 packages/linux-arm64/bin/codex-notify
          cp artifacts/darwin-x64/codex-notify-darwin-x64 packages/darwin-x64/bin/codex-notify
          cp artifacts/darwin-arm64/codex-notify-darwin-arm64 packages/darwin-arm64/bin/codex-notify
          chmod +x packages/linux-*/bin/codex-notify packages/darwin-*/bin/codex-notify

      - name: Stage top-level npm package
        shell: bash
        run: |
          mkdir -p packages/go-codex-notify/bin
          cp bin/cli.js packages/go-codex-notify/bin/cli.js
          cp README.md LICENSE packages/go-codex-notify/

      - name: Publish platform npm packages
        shell: bash
        run: |
          for directory in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            name=$(node -p "require('./packages/$directory/package.json').name")
            version=$(node -p "require('./packages/$directory/package.json').version")
            if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Already published: $name@$version"
            else
              npm publish "./packages/$directory" --registry https://registry.npmjs.org --access public --provenance
            fi
          done

      - name: Publish scoped compatibility npm package
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Already published: $name@$version"
          else
            npm publish --registry https://registry.npmjs.org --access public --provenance
          fi

      - name: Publish top-level npm package
        shell: bash
        run: |
          name=$(node -p "require('./packages/go-codex-notify/package.json').name")
          version=$(node -p "require('./packages/go-codex-notify/package.json').version")
          if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Already published: $name@$version"
          else
            npm publish ./packages/go-codex-notify --registry https://registry.npmjs.org --access public --provenance
          fi
